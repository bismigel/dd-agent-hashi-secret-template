# Datadog Agent with the native HashiCorp Vault secret backend.
#
# Native Vault support is built into the Agent (7.70+). This template pins
# 7.85.0, which also supports runtime refresh of secrets used by file-based
# checks (7.76+).

api_key: ENC[/secret/datadog;api_key]
# Must match your Datadog organization's region. DD_SITE overrides this.
site: us5.datadoghq.com
hostname: dd-agent-hashi-secret

secret_backend_type: hashicorp.vault
secret_backend_config:
  vault_address: http://vault:8200
  # Dev/demo only. For production use vault_session (Kubernetes/AppRole), or
  # set implicit_auth: "true" and provide VAULT_TOKEN in the environment.
  vault_token: root

# Refresh resolved secrets without restarting the Agent. Without this, a
# rotated Vault secret is only picked up on restart.
secret_refresh_interval: 60

log_level: INFO

# The process/trace agents need extra host privileges and are not relevant to
# the Vault integration.
process_agent_enabled: false
trace_agent_enabled: false

bind_host: 0.0.0.0
