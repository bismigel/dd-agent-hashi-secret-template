services:
  vault:
    image: hashicorp/vault:1.21.2
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev -dev-root-token-id=root
    healthcheck:
      # The Vault image has wget (busybox), not curl.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - dd-vault-net

  datadog-agent:
    build: .
    container_name: datadog-agent
    ports:
      - "8125:8125/udp"  # DogStatsD
      - "8126:8126"      # Trace Agent
    environment:
      - VAULT_DD_API_KEY=${VAULT_DD_API_KEY:-dummy-datadog-api-key}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
      - DD_SECRET_REFRESH_INTERVAL=${DD_SECRET_REFRESH_INTERVAL:-60}
      - DD_LOG_LEVEL=${DD_LOG_LEVEL:-info}
    volumes:
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    depends_on:
      vault:
        condition: service_healthy
      status-api:
        condition: service_started
    networks:
      - dd-vault-net

  # The basic-auth target the Agent checks through Vault-provided credentials.
  # /api/detail returns 401 without credentials and 200 with testuser:testpass.
  status-api:
    image: ghcr.io/bismigel/status-api:${STATUS_API_TAG:-latest}
    container_name: status-api
    ports:
      - "8080:8080"
    environment:
      STATUS_USER: testuser
      STATUS_PASS: testpass
      CHECKS_FILE: /etc/status/checks.json
      POLL_SECONDS: "10"
    volumes:
      - ./status-api-checks.json:/etc/status/checks.json:ro
    networks:
      - dd-vault-net

networks:
  dd-vault-net:
    driver: bridge
