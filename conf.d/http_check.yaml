# Basic-auth check against status-api. Credentials come from Vault via the
# Agent's native hashicorp.vault backend.
instances:
  - name: status-api detail (Vault basic auth)
    url: http://status-api:8080/api/detail
    timeout: 10
    username: ENC[/secret/http_check;username]
    password: ENC[/secret/http_check;password]
    disable_ssl_validation: false
    headers:
      User-Agent: Datadog Agent/1.0
    tags:
      - env:demo
      - service:status-api
